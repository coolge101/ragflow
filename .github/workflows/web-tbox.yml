name: web-tbox
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "web-tbox/**"
      - ".github/workflows/web-tbox.yml"
  push:
    branches:
      - main
      - "*.*.*"
    paths:
      - "web-tbox/**"
      - ".github/workflows/web-tbox.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-tbox
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web-tbox/.node-version
          cache: npm
          cache-dependency-path: web-tbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
