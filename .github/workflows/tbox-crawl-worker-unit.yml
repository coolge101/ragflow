name: tbox-crawl-worker-unit
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "rag/svr/tbox_crawl_worker.py"
      - "test/unit_test/rag/svr/test_tbox_crawl_worker.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tbox-crawl-worker-unit.yml"
  push:
    branches:
      - main
      - "*.*.*"
    paths:
      - "rag/svr/tbox_crawl_worker.py"
      - "test/unit_test/rag/svr/test_tbox_crawl_worker.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tbox-crawl-worker-unit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest tbox crawl worker (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --python 3.12 --group test --frozen

      - name: Run unit tests
        run: uv run pytest test/unit_test/rag/svr/test_tbox_crawl_worker.py -v --tb=short
