name: tbox-crawl-common-unit
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "common/tbox_crawl_ssrf_fetch.py"
      - "common/tbox_crawl_last_error.py"
      - "common/ssrf_guard.py"
      - "common/tbox_crawl_origin_throttle.py"
      - "test/unit_test/common/test_tbox_crawl_ssrf_fetch.py"
      - "test/unit_test/common/test_tbox_crawl_last_error.py"
      - "test/unit_test/common/test_tbox_crawl_origin_throttle.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tbox-crawl-common-unit.yml"
  push:
    branches:
      - main
      - "*.*.*"
    paths:
      - "common/tbox_crawl_ssrf_fetch.py"
      - "common/tbox_crawl_last_error.py"
      - "common/ssrf_guard.py"
      - "common/tbox_crawl_origin_throttle.py"
      - "test/unit_test/common/test_tbox_crawl_ssrf_fetch.py"
      - "test/unit_test/common/test_tbox_crawl_last_error.py"
      - "test/unit_test/common/test_tbox_crawl_origin_throttle.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tbox-crawl-common-unit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest tbox crawl common units
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync test dependencies
        run: uv sync --python 3.12 --group test --frozen

      - name: Run unit tests
        run: |
          uv run pytest \
            test/unit_test/common/test_tbox_crawl_ssrf_fetch.py \
            test/unit_test/common/test_tbox_crawl_last_error.py \
            test/unit_test/common/test_tbox_crawl_origin_throttle.py \
            -v --tb=short
